[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rednote-aigt"
version = "0.1.0"
description = "Data preparation pipeline for detecting AI-generated Chinese RedNote/Xiaohongshu posts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "datasets",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "pytest",
    "scikit-learn",
    "torch",
    "transformers",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle correctness. I: import sorting.
# Formatting-only style (E501 line length etc.) is left to `ruff format`.
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["rednote_aigt"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py insert src/ onto sys.path before importing rednote_aigt, so the
# package resolves without an editable install. That import has to come after
# the path insert.
"scripts/*.py" = ["E402"]
