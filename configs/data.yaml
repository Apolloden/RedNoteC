seed: 42

paths:
  human_file: data/raw/training_set_human.jsonl
  aigc_file: data/raw/training_set_aigc.jsonl
  exploration_file: data/raw/exploration_set.jsonl
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: outputs/reports

split:
  train: 0.70
  val: 0.15
  test: 0.15
  prefer_domain_stratification: true
  min_stratum_count: 2

cleaning:
  keep_title_only_rows: true
  min_title_only_chars: 1
